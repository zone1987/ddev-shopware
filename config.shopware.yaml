#ddev-generated
# Ports and environment for the Shopware Administration and Storefront watchers.
#
# The watchers bind inside the web container and are published through
# ddev-router, so they are reachable at your project URL:
#
#   Administration : https://<project>.ddev.site:5173
#   Storefront     : https://<project>.ddev.site:9998
#
# To change a port, copy the relevant block into your own
# `.ddev/config.shopware-local.yaml` -- do not edit this file, it is
# overwritten by `ddev add-on get`.

web_environment:
  # Optional explicit path to the Shopware root inside the container. Leave it
  # unset to let the commands detect it; override it per project with
  #   ddev dotenv set .ddev/.env.shopware --shopware-project-root=/var/www/html/shopware
  - SHOPWARE_PROJECT_ROOT=${SHOPWARE_PROJECT_ROOT:-}
  # Bind the Vite dev server on all interfaces so ddev-router can reach it.
  - HOST=0.0.0.0
  - PORT=5173
  # Type checking during the admin watcher slows the rebuild loop down a lot.
  - DISABLE_ADMIN_COMPILATION_TYPECHECK=1
  # The Storefront watcher proxies through the router URL.
  - PROXY_URL=${DDEV_PRIMARY_URL}:9998
  # DDEV uses a self-signed certificate inside the container.
  - STOREFRONT_SKIP_SSL_CERT=true
  # Shopware's admin dependencies pull Puppeteer; the browser is not needed here.
  - PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true

web_extra_exposed_ports:
  - name: shopware-admin-proxy
    container_port: 5173
    http_port: 5172
    https_port: 5173
  - name: shopware-storefront-proxy
    container_port: 9998
    http_port: 8888
    https_port: 9998
  - name: shopware-storefront-assets
    container_port: 9999
    http_port: 8889
    https_port: 9999
